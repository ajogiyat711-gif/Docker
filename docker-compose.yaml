services:
  
  db:
    image: postgres:18
    restart: always
  
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: my_database
    
    volumes:
      - abgres_data:/var/lib/postgresql
    
  app:
    build: .
    depends_on:
      - db
    stdin_open: true
    tty: true

    environment:
      DB_HOST: db
      DB_NAME: my_database
      DB_USER: user
      DB_PASSWORD: password
    
  adminer:
    image: adminer
    ports:
       - "8080:8080"
    
volumes:
    abgres_data:      

      

  
